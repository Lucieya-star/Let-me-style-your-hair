<!DOCTYPE html>
<html>
<head>
    <title>Let Me Style Your Hair</title>
    <!-- Alpine.js Library -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* The style section controls how pieces of your webpage look. */
        .section {
            margin-top: 20px;
        }
    </style>
</head>   

<body style="background-color:powderblue;" x-data="webApp">
    <!-- The body section contains the content of your webpage. -->
    <header>
        <h1 style="text-align:center;">Let Me Style Your Hair</h1>
    </header>

    <main>
        <h2>What's your aesthetic?</h2>
        
        <!-- Radio buttons using x-model -->
        <label>
            <input type="radio" name="aesthetic" value="business" x-model="radioChoice"> Business
        </label>
        <label>
            <input type="radio" name="aesthetic" value="goth" x-model="radioChoice"> Goth
        </label>
        <label>
            <input type="radio" name="aesthetic" value="simple" x-model="radioChoice"> Simple
        </label>
        <label>
            <input type="radio" name="aesthetic" value="clean" x-model="radioChoice"> Clean
        </label>

        <!-- Live Preview of the selection -->
        <p>Value of radioChoice: <span x-text="radioChoice"></span></p>

        <h2>Event Attending?</h2>
        
        <!-- Interactive Element -->
        <div class="section">
            <div id="Event_Dropdown">
                <label for="event-dropdown">Choose an event type:</label>
                <!-- @change can be used with dropdown menus, but x-model updates automatically -->
                <select id="event-dropdown" x-model="dropdownVal">
                    <option value="">-- Select --</option>
                    <option value="School">School</option>
                    <option value="Meeting">Meeting</option>
                    <option value="Dinner">Dinner</option>
                    <option value="Date">Date</option>
                </select>
            </div>

            <!-- Hairstyle Output -->
            <!-- Got help from Gemini AI-->
        <div class="result-box" >
        <p class="result-title">Suggested Hairstyle</p>
        <p class="suggestion-text" x-text="currentStyle || 'Select options above to see a suggestion!'"></p>
            
            <template x-if="radioChoice && dropdownVal">
                <button type="button" class="reroll-btn" @click="generateStyle()">
                    🎲 Shuffle New Style
                </button>
            </template>
        </div>
      </div>
    </main>
    
    <footer>
        <p><br>
        <br>
        </p>
    </footer>
  
    <script>
        // The script section contains the JavaScript logic
        document.addEventListener('alpine:init', () => {
            Alpine.data('webApp', () => ({
                radioChoice: '',
                dropdownVal: '', // <!-- Got help from a peer -->
                currentStyle: '',
                // Style options tailored by aesthetic
                <!-- Got help from Gemini AI for this whole section-->
                styles: {
                    business: ['Sleek Low Bun', 'Neat Side Part', 'Smooth Blowout', 'Polished French Twist'],
                    goth: ['Voluminous Messy Shag', 'Dark Slicked-Back Undercut', 'Braided Pigtails with Clips', 'Wavy Half-Up Topknot'],
                    simple: ['Classic Ponytail', 'Natural Loose Waves', 'Quick Messy Bun', 'Straight & Tuck Behind Ears'],
                    clean: ['Glass Hair Slick Back', 'Clean Middle Part Bob', 'Sleek High Ponytail', 'Minimalist Claw Clip Updo']
                },

                // Reactive watcher to automatically update recommendations when options change
                init() {
                    this.$watch('radioChoice', () => this.generateStyle());
                    this.$watch('dropdownVal', () => this.generateStyle());
                },

                // Pick a hairstyle based on selections
                generateStyle() {
                    if (!this.radioChoice || !this.dropdownVal) {
                        this.currentStyle = '';
                        return;
                    }

                    const availableStyles = this.styles[this.radioChoice];
                    if (availableStyles && availableStyles.length > 0) {
                        // Pick a random style from the list
                        const randomIndex = Math.floor(Math.random() * availableStyles.length);
                        this.currentStyle = `${availableStyles[randomIndex]} (Perfect for ${this.dropdownVal})`;
                    }
                }
            }));
        });
    </script>
</body>
</html>

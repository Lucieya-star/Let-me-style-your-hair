<!DOCTYPE html>
<!-- This code was provided as starter code by my teacher. -->
<html>
<head>
    <title>Let Me Style Your Hair</title>
    <!-- Alpine.js Library -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* The style section controls how pieces of your webpage look. */
    </style>
</head>   

<body style="background-color:powderblue;" x-data="webApp">
    <!-- The body section contains the content of your webpage. -->
    <header>
        <h1 style="text-align:center;">Let Me Style Your Hair</h1>
        <h1>What's your aesthetic?</h1>
        
        <!-- Radio buttons using x-model -->
        <label>
            <input type="radio" name="aesthetic" value="business" x-model="radioChoice"> Business
        </label>
        <label>
            <input type="radio" name="aesthetic" value="goth" x-model="radioChoice"> Goth
        </label>
        <label>
            <input type="radio" name="aesthetic" value="simple" x-model="radioChoice"> Simple
        </label>
        <label>
            <input type="radio" name="aesthetic" value="clean" x-model="radioChoice"> Clean
        </label>

        <!-- Live Preview of the selection -->
         <!--Generated by Gemini AI -->
        <p>Value of radioChoice: <span x-text="radioChoice"></span></p>
    </header>
        <h1>Event Attending?</h1>
        <label>
                <!-- Interactive Element -->
      <div class="section">
        <span class="section-title"></span>
				<div id="TODO_Dropdown">
					<label for="icecream-dropdown">Choose an ice cream flavor:</label>
        <!--@change can be used with dropdown menus. -->
        <select x-model="dropdownVal">
          <option value="">-- Select --</option>
          <option value="School">School</option>
          <option value="Meeting">Meeting</option>
          <option value="Dinner">Dinner</option>
          <option value="Date">Date</option>
        </select>
			</div>

   <!-- Output -->
        <p>Value of dropdownVal: <span x-text="dropdownVal"></span></p>
      </div>
        <!-- Live Preview of the selection -->
    </header>
    
    <footer>
        <p>A<br>
        B <br>
        C</p>
    </footer>
  
    <script>
        // The script section contains the JavaScript logic
        document.addEventListener('alpine:init', () => {
            Alpine.data('webApp', () => ({
                radioChoice: ""
            }));
        });
    </script>
</body>
</html>
